<span class="section-header">Skills</span>

<div class="skill-list">
    @for (slot of slots; track slot) {
    <mat-form-field>
        <mat-label>Skill {{ slot + 1 }}</mat-label>
        <mat-select [formControl]="controls[slot]">
            <mat-option [value]="null">-</mat-option>
            @for (skill of availableSkills; track skill.id) {
            <mat-option [value]="skill.id" [disabled]="isSelectedElsewhere(skill.id, slot)">
                {{ skill.name }}
            </mat-option>
            }
        </mat-select>
    </mat-form-field>
    }
</div>
