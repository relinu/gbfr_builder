<h2 mat-dialog-title>Select Character</h2>

<mat-dialog-content>
    <mat-nav-list>
        @for (character of getCharacters(); track character.id) {
        <a mat-list-item (click)="select(character)">
            <div matListItemTitle>{{ character.name }}</div>
        </a>
        }
    </mat-nav-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
